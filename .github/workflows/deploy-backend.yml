name: Deploy Backend to Server

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "apps/backend/**"
            - "packages/**"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "tsconfig.base.json"
            - ".github/workflows/deploy-backend.yml"

concurrency:
    group: deploy-backend
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # 1. Connect to Tailscale network via OAuth
            - name: Connect to Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            # 2. Set up the Buildx engine with the correct driver for caching
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # 3. Login to Docker Hub
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # 4. Build and push image to Docker Hub
            #    context is the repo root so pnpm workspace deps are available
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./apps/backend/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/sortund-backend:latest
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=max,scope=backend

            # 5. Test connectivity to server
            - name: Test Ping to Server
              run: ping -c 4 ${{ secrets.SERVER_IP }}

            # 6. Deploy to server via SSH (inside Tailscale tunnel).
            #    Runtime secrets live on the server (chmod 600):
            #      ~/sortund/postgres.env — POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
            #      ~/sortund/backend.env  — DATABASE_URL, JWT_*, AI_WORKER_URL, AI_WORKER_TOKEN, ADMIN_EMAILS, …
            - name: Deploy via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  command_timeout: 10m
                  script: |
                      set -e
                      IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/sortund-backend:latest"
                      for f in backend.env postgres.env; do
                        test -f ~/sortund/$f || { echo "~/sortund/$f is missing"; exit 1; }
                      done
                      docker network create sortund-net 2>/dev/null || true

                      # ── Postgres (only started if not already running) ────────────
                      if ! docker ps --format '{{.Names}}' | grep -q '^sortund-postgres$'; then
                        docker rm sortund-postgres 2>/dev/null || true
                        docker run -d --name sortund-postgres --network sortund-net --env-file ~/sortund/postgres.env -v sortund-pgdata:/var/lib/postgresql/data --restart unless-stopped postgres:17-alpine
                        until docker exec sortund-postgres pg_isready -U postgres >/dev/null 2>&1; do sleep 2; done
                      fi

                      # ── Backend (runs DB migrations on startup) ───────────────────
                      docker pull "$IMAGE"
                      docker stop sortund-backend 2>/dev/null || true
                      docker rm sortund-backend 2>/dev/null || true
                      docker run -d --name sortund-backend --network sortund-net -p 3000:3000 --env-file ~/sortund/backend.env --restart unless-stopped "$IMAGE"

                      for i in $(seq 1 60); do
                        if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                          echo "Backend is healthy"
                          # The mobile app reaches the backend through Tailscale Funnel (public HTTPS).
                          tailscale funnel --bg 3000 >/dev/null
                          docker image prune -f >/dev/null
                          exit 0
                        fi
                        sleep 2
                      done
                      echo "Backend did not become healthy"
                      docker logs --tail 100 sortund-backend
                      exit 1

            # 7. Cleanup Tailscale connection
            - name: Disconnect Tailscale
              if: always()
              run: sudo tailscale logout

name: Build Android APK

# Every push that touches the mobile app builds a signed release APK and publishes it on the
# repository's Releases page, so it can be downloaded and installed on a phone.
on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "apps/frontend/**"
            - "packages/**"
            - "pnpm-lock.yaml"
            - ".github/workflows/release-android.yml"

concurrency:
    group: release-android
    cancel-in-progress: true

permissions:
    contents: write # create releases

env:
    # Backend URL baked into the app (public HTTPS through Tailscale Funnel).
    # Can be overridden with the repository variable EXPO_PUBLIC_API_URL.
    EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://olegserver.tailc406cc.ts.net' }}
    VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
    apk:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Gradle (with cache)
              uses: gradle/actions/setup-gradle@v4

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # android/ is not committed (Continuous Native Generation) — generate it from app.json.
            - name: Expo prebuild
              working-directory: apps/frontend
              env:
                  CI: "1"
              run: npx expo prebuild --platform android --no-install --clean

            # Release key from repository secrets. Without it the APK is signed with the debug key
            # (still installable, but updates must then keep using the debug key).
            - name: Prepare signing key
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  if [ -n "$KEYSTORE_BASE64" ]; then
                    echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
                    {
                      echo "SORTUND_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
                      echo "SORTUND_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
                      echo "SORTUND_KEY_ALIAS=$KEY_ALIAS"
                      echo "SORTUND_KEY_PASSWORD=$KEY_PASSWORD"
                    } >> "$GITHUB_ENV"
                    echo "Signing with the release key"
                  else
                    echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — signing with the debug key"
                  fi

            - name: Build release APK
              working-directory: apps/frontend/android
              env:
                  NODE_ENV: production
                  SORTUND_VERSION_CODE: ${{ github.run_number }}
                  SORTUND_VERSION_NAME: ${{ env.VERSION_NAME }}
              # arm64-v8a covers practically all phones from the last ~8 years and halves build time.
              run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

            - name: Rename APK
              run: |
                  mkdir -p dist
                  cp apps/frontend/android/app/build/outputs/apk/release/app-release.apk "dist/Sortund-${VERSION_NAME}.apk"
                  ls -lh dist

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: android-v${{ env.VERSION_NAME }}
                  name: Sortund ${{ env.VERSION_NAME }}
                  target_commitish: ${{ github.sha }}
                  make_latest: true
                  files: dist/Sortund-${{ env.VERSION_NAME }}.apk
                  body: |
                      Android APK built from ${{ github.sha }}.

                      **${{ github.event.head_commit.message || 'Manual build' }}**

                      Download `Sortund-${{ env.VERSION_NAME }}.apk` on the phone and open it
                      (allow installing apps from this source). Backend: ${{ env.EXPO_PUBLIC_API_URL }}

name: Deploy AI-worker to Server

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "apps/ai-worker/**"
            - ".github/workflows/deploy-ai-worker.yml"

# Never run two deployments of the worker at the same time.
concurrency:
    group: deploy-ai-worker
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # 1. Connect to Tailscale network via OAuth
            - name: Connect to Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            # 2. Set up the Buildx engine with the correct driver for caching
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # 3. Login to Docker Hub
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # 4. Build and push image to Docker Hub
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: ./apps/ai-worker
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-worker:latest
                  cache-from: type=gha,scope=ai-worker
                  cache-to: type=gha,mode=max,scope=ai-worker

            # 5. Test connectivity to server
            - name: Test Ping to Server
              run: ping -c 4 ${{ secrets.SERVER_IP }}

            # 6. Deploy to server via SSH (inside Tailscale tunnel).
            #    Runtime secrets live on the server in ~/sortund/worker.env (chmod 600):
            #    WORKER_TOKEN (shared with the backend), HF_TOKEN, WHISPER_MODEL, …
            - name: Deploy via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  command_timeout: 20m
                  script: |
                      set -e
                      IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ai-worker:latest"
                      test -f ~/sortund/worker.env || { echo "~/sortund/worker.env is missing"; exit 1; }
                      docker network create sortund-net 2>/dev/null || true

                      docker pull "$IMAGE"
                      docker stop ai-worker 2>/dev/null || true
                      docker rm ai-worker 2>/dev/null || true

                      # Only the backend talks to the worker (over sortund-net). The port is bound to
                      # localhost for debugging only and is not reachable from outside.
                      # ONNX models are kept on the server (~/sortund/models) so the worker does not depend on
                      # downloading them from the private Hugging Face repository on every start.
                      MODELS=""
                      if [ -d ~/sortund/models/audio_tagger ]; then MODELS="-v $HOME/sortund/models:/home/user/app/app/ml/model:ro"; fi
                      docker run -d --name ai-worker --network sortund-net -p 127.0.0.1:8000:8000 --env-file ~/sortund/worker.env -v sortund-worker-cache:/home/user/.cache $MODELS --restart unless-stopped "$IMAGE"

                      # Models are loaded on startup (first start downloads them) — wait for /health.
                      for i in $(seq 1 120); do
                        if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
                          echo "AI worker is healthy"
                          docker image prune -f >/dev/null
                          exit 0
                        fi
                        sleep 5
                      done
                      echo "AI worker did not become healthy"
                      docker logs --tail 100 ai-worker
                      exit 1

            # 7. Cleanup Tailscale connection
            - name: Disconnect Tailscale
              if: always()
              run: sudo tailscale logout
